<header class="topbar">
  <div class="brand-wrap">
    <span class="brand-mark">B</span>
    <div>
      <p class="brand-name">Bloggy</p>
      <p class="brand-tag">Community blog hub</p>
    </div>
  </div>

  <nav class="nav" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    @if (auth.isAuthenticated()) {
      <a routerLink="/my-blogs" routerLinkActive="active">My blogs</a>
      <button type="button" class="auth-button" (click)="auth.logout()">Log out</button>
    } @else {
      <button type="button" class="auth-button" (click)="auth.login()">Log in</button>
      <button type="button" class="auth-button secondary-auth-button" (click)="auth.register()">Sign up</button>
    }
  </nav>
</header>

<main class="content-shell">
  <router-outlet />
</main>
