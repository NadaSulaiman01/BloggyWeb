<section class="page-shell">
  <header class="header-row">
    <div>
      <p class="eyebrow">Your workspace</p>
      <h1>Manage your blogs</h1>
    </div>
  </header>

  <form class="editor-card" (ngSubmit)="onSubmit()" #blogForm="ngForm">
    <h2>{{ editingBlogId ? 'Edit blog' : 'Create a new blog' }}</h2>

    <div class="field-group">
      <label for="title">Title</label>
      <input id="title" name="title" [(ngModel)]="formModel.title" type="text" placeholder="Enter a blog title" required />
    </div>

    <div class="field-group">
      <label for="content">Content</label>
      <textarea
        id="content"
        name="content"
        [(ngModel)]="formModel.content"
        rows="6"
        placeholder="Write your content here..."
        required
      ></textarea>
    </div>

    <div class="button-row">
      <button type="submit" class="primary-btn" [disabled]="isSubmitting || blogForm.invalid">
        {{ isSubmitting ? 'Saving...' : editingBlogId ? 'Update blog' : 'Create blog' }}
      </button>
      <button type="button" class="secondary-btn" (click)="resetForm()" [disabled]="isSubmitting">
        Cancel
      </button>
    </div>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  </form>

  <div *ngIf="isLoading" class="status-panel">Loading your blogs...</div>

  <div *ngIf="!isLoading && blogs.length === 0" class="empty-state">
    <h2>You have no blogs yet</h2>
    <p>Create your first idea and share it with the community.</p>
  </div>

  <div *ngIf="!isLoading && blogs.length > 0" class="blog-list">
    <article *ngFor="let blog of blogs" class="blog-item">
      <div class="blog-item-copy">
        <h3>{{ blog.title }}</h3>
        <p>{{ blog.content }}</p>
      </div>

      <div class="blog-item-actions">
        <button type="button" class="secondary-btn" (click)="editBlog(blog)">Edit</button>
        <button type="button" class="danger-btn" (click)="deleteBlog(blog.id)">Delete</button>
      </div>
    </article>
  </div>

  <nav *ngIf="!isLoading && blogs.length > 0" class="pagination" aria-label="My blog pagination">
    <button type="button" (click)="goToPreviousPage()" [disabled]="currentPage === 1">
      Previous
    </button>
    <span>Page {{ currentPage }} of {{ totalPages }}</span>
    <button type="button" (click)="goToNextPage()" [disabled]="currentPage >= totalPages">
      Next
    </button>
  </nav>
</section>
